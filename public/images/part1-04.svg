  <rect x="230" y="336" width="220" height="12" fill="#8f9bab"/>
  <!-- kệ sau -->
  <rect x="404" y="86" width="170" height="150" rx="5" fill="#ffffff" stroke="#8f9bab" stroke-width="4"/>
  <line x1="404" y1="136" x2="574" y2="136" stroke="#8f9bab" stroke-width="4"/>
  <line x1="404" y1="186" x2="574" y2="186" stroke="#8f9bab" stroke-width="4"/>
  <rect x="424" y="102" width="16" height="30" fill="#1c4b87"/>
  <rect x="452" y="102" width="16" height="30" fill="#176038"/>
  <rect x="480" y="102" width="16" height="30" fill="#982a21"/>
